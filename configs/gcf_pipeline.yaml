assembly_scope: GCF_only
assembly_source: RefSeq
include_files:
  - genome
  - gff3
  - gtf
  - gbff
  - rna
  - seq-report
upstream_window:
  prokaryote: 300
  eukaryote: 1000
organism_type_rules:
  Eukaryota: eukaryote
  Bacteria: prokaryote
  Archaea: prokaryote
  Viruses: exclude
paths:
  input_accessions: data/input/selected_accessions.txt
  raw_dir: data/raw
  download_zip: data/raw/ncbi_gcf_genomes.zip
  interim_dir: data/interim
  processed_dir: data/processed
  log_dir: data/logs

inventory:
  source_url: https://ftp.ncbi.nlm.nih.gov/genomes/refseq/assembly_summary_refseq.txt
  local_path: data/metadata/assembly_summary_refseq.txt
  output_dir: data/interim/inventory
  allow_network: true
  force_download: false
  eligibility_rules:
    require_gcf_prefix: true
    exclude_suppressed: true
    exclude_excluded_from_refseq: true
    exclude_genome_rep_partial: false
    allowed_groups:
      - archaea
      - bacteria
      - fungi
      - plant
      - protozoa
      - invertebrate
      - vertebrate_mammalian
      - vertebrate_other
    excluded_groups:
      - viral
