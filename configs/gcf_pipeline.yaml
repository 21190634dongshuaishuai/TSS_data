assembly_scope: GCF_only
assembly_source: RefSeq
include_files:
  - genome
  - gff3
  - gtf
  - gbff
  - rna
  - seq-report
upstream_window:
  prokaryote: 300
  eukaryote: 1000
organism_type_rules:
  Eukaryota: eukaryote
  Bacteria: prokaryote
  Archaea: prokaryote
  Viruses: exclude
paths:
  input_accessions: data/input/selected_accessions.txt
  raw_dir: data/raw
  download_zip: data/raw/ncbi_gcf_genomes.zip
  interim_dir: data/interim
  processed_dir: data/processed
  log_dir: data/logs
