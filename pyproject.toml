[project]
name = "tss-data"
version = "0.1.0"
description = "GCF-only annotation-derived TSS/promoter candidate data pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
